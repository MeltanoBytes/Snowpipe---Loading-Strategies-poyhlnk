default_environment: dev
project_id: 01a0d4e7-e040-7fa4-b019-b305d3def061
environments:
- name: dev
- name: staging
- name: prod
plugins:
  extractors:
  - name: tap-meltano-cloud
    variant: meltanolabs
    pip_url: git+https://github.com/MeltanoLabs/tap-meltano-cloud.git@v0.1.6
  loaders:
  - name: target-postgres
    variant: matatika
    pip_url: git+https://github.com/Matatika/pipelinewise-target-postgres.git@v0.2.2
  - name: target-snowflake
    variant: meltanolabs
    pip_url: "'meltanolabs-target-snowflake[snowpipe] @ git+https://github.com/MeltanoLabs/target-snowflake.git@v0.20.1'"
  transformers:
  - name: dbt
    variant: dbt-labs
    pip_url: dbt-core~=1.7.0 dbt-postgres~=1.7.0 dbt-snowflake~=1.7.0 dbt-bigquery~=1.7.0 dbt-sqlserver~=1.7.0 dbt-clickhouse~=1.7.0 dbt-duckdb~=1.7.0 duckdb==1.5.5 certifi==2025.1.31
  files:
  - name: files-melty-ai
    variant: matatika
    pip_url: git+https://github.com/meltano/files-melty-ai.git@v0.1.0
  - name: files-dbt
    variant: matatika
    pip_url: git+https://github.com/Matatika/files-dbt@v1.5
    lock: true
  utilities:
  - name: matatika
    variant: matatika
    pip_url: matatika~=1.17.1
    lock: true
  - name: dbt-artifacts
    variant: matatika
    pip_url: git+https://github.com/Matatika/dbt-artifacts-ext.git@v0.1.0
    lock: true
